<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BRIGHTER-PAD</title>
    
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    
    <!-- Estilos -->
    <link rel="stylesheet" href="css/styles.css">
    <link rel="stylesheet" href="css/glass.css">
    <link rel="stylesheet" href="css/animations.css">
</head>
<body>
    <!-- Header -->
    <header class="header glass">
        <div class="header-left">
            <div class="logo">
                <svg width="40" height="40" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
                    <!-- Cuerpo (Rojo Coral) -->
                    <circle cx="50" cy="45" r="30" fill="#FF5440"/>
                    <!-- Ala (Verde Turquesa) -->
                    <path d="M50 20 Q70 10 80 30 Q70 35 50 35 Z" fill="#2BBC91"/>
                    <!-- Cabeza (Rojo Intenso) -->
                    <circle cx="30" cy="30" r="15" fill="#EC232A"/>
                    <!-- Pico (Naranja) -->
                    <polygon points="20,25 10,20 20,35" fill="#FF6E2B"/>
                    <!-- Ojo -->
                    <circle cx="25" cy="28" r="4" fill="white"/>
                    <circle cx="24" cy="27" r="2" fill="black"/>
                </svg>
                <span class="logo-text">BRIGHTER-PAD</span>
            </div>
        </div>
        <div class="header-right">
            <div class="search-container glass">
                <input type="text" id="searchInput" placeholder="Buscar aplicaciones..." class="search-input">
                <span class="search-icon">🔍</span>
            </div>
            <button class="theme-toggle glass" id="themeToggle" aria-label="Cambiar tema">
                <span class="theme-icon">🌙</span>
            </button>
        </div>
    </header>

    <!-- Main Content -->
    <main id="mainContent">
        <!-- Sección Home (Categorías) -->
        <section id="homeSection" class="section active">
            <div class="section-header">
                <h1 class="section-title">Bibliotecas Digitales</h1>
                <p class="section-subtitle">Selecciona una categoría para explorar sus aplicaciones</p>
            </div>
            <div id="categoriesGrid" class="grid-container"></div>
        </section>

        <!-- Sección Apps (Biblioteca) -->
        <section id="appsSection" class="section">
            <div class="section-header">
                <button id="backButton" class="back-button glass" aria-label="Volver">
                    <span class="back-icon">←</span> Volver
                </button>
                <div class="category-info">
                    <h2 id="categoryTitle" class="section-title">Categoría</h2>
                    <p id="categoryDescription" class="section-subtitle">Aplicaciones disponibles</p>
                </div>
            </div>
            <div id="appsGrid" class="grid-container"></div>
        </section>

        <!-- Modal de Detalle de App -->
        <div id="appModal" class="modal">
            <div class="modal-content glass">
                <button class="modal-close" id="modalClose">✕</button>
                <div class="modal-body">
                    <div class="modal-icon" id="modalIcon">📱</div>
                    <h2 id="modalTitle">Nombre de App</h2>
                    <p id="modalDescription">Descripción detallada de la aplicación</p>
                    <div class="modal-actions">
                        <button class="btn-primary" id="modalDownload">
                            <span>📥</span> Descargar
                        </button>
                        <button class="btn-secondary" id="modalOpen">
                            <span>🌐</span> Abrir
                        </button>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <!-- Footer -->
    <footer class="footer">
        <p>© 2026 BRIGHTER-PAD - Pantallas Interactivas</p>
    </footer>

    <!-- Scripts -->
    <script src="js/data.js"></script>
    <script src="js/router.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
